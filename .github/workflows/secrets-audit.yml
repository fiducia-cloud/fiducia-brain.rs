name: secrets-audit

# Fail-closed check that no plaintext secret can reach this repository.
#
# Runs with NO age key on purpose. Everything it asserts is key-independent:
# that no plaintext env file is tracked or staged, that .gitignore still denies
# them, that nothing was force-added past those rules, and that every file in
# env/enc/ is genuinely sops-encrypted with at least two recipients. Handing CI
# a decryption key merely to lint would defeat the audit it is performing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SELECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  ORES_SOPS_SHA: 47d5bd4ddc13ccc3c9bde53ee0ee8e2fa846fa94
  FLAGS2ENV_SHA: 8892365548557e437d81a0d44d650fb9abff6c44

jobs:
  env-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out raw source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SELECTED_SOURCE_SHA }}
          persist-credentials: false
          # env-check inspects tracked history, not just the worktree.
          fetch-depth: 0

      - name: Assert selected source head
        run: test "$(git rev-parse HEAD)" = "$SELECTED_SOURCE_SHA"

      - name: Install just
        env:
          JUST_VERSION: 1.51.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version

      - name: Install pinned flags2env and ores-sops
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts=false \
            "https://github.com/flags-2-env/flags-2-env/archive/${FLAGS2ENV_SHA}.tar.gz"
          printf '%s\n' "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

          archive="$RUNNER_TEMP/ores-sops.tar.gz"
          root="$RUNNER_TEMP/ores-sops-src"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/ORESoftware/ores-sops/archive/${ORES_SOPS_SHA}.tar.gz" \
            --output "$archive"
          mkdir -p "$root"
          tar -xzf "$archive" --strip-components=1 -C "$root"
          chmod +x "$root/ores-sops" "$root/scripts/ores-sops-core" "$root/scripts/ores-sops-telemetry"
          printf '%s\n' "$root" >> "$GITHUB_PATH"

      - name: just env-check
        run: just env-check
