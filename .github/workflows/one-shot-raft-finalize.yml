name: one-shot brain Raft hardening finalizer

on:
  push:
    branches: [audit/raft-recovery-hardening]

permissions:
  contents: write

concurrency:
  group: brain-raft-finalizer
  cancel-in-progress: false

jobs:
  harden:
    if: github.repository == 'fiducia-cloud/fiducia-brain.rs' && github.ref == 'refs/heads/audit/raft-recovery-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          path: fiducia-brain.rs
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: ee8fe09f846f5a776d156c0b0d0d15582c8bd539
          path: fiducia-interfaces
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-routing.rs
          ref: c694bc5c58587bec12989a347e926c0040aacada
          path: fiducia-routing.rs
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Apply protocol and recovery hardening
        working-directory: fiducia-brain.rs
        run: python3 .github/scripts/apply_raft_hardening.py
      - name: Format
        working-directory: fiducia-brain.rs
        run: cargo fmt --all
      - name: Test all targets
        working-directory: fiducia-brain.rs
        run: cargo test --locked --all-targets
      - name: Clippy
        working-directory: fiducia-brain.rs
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Commit verified product source and remove one-shot machinery
        working-directory: fiducia-brain.rs
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/scripts/apply_raft_hardening.py \
            .github/workflows/one-shot-raft-audit.yml \
            .github/workflows/one-shot-raft-v2.yml \
            .github/workflows/one-shot-raft-finalize.yml \
            .github/one-shot-raft-trigger
          git add src/raft.rs src/raft_driver.rs src/raft_store.rs docs/raft-safety-boundaries.md
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: harden brain Raft replication and recovery invariants'
          git push origin HEAD:audit/raft-recovery-hardening
