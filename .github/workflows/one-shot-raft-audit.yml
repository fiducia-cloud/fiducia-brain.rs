        // With a ~50ms driver tick: heartbeat 150ms, election 500–900ms — well
        // above 3× the heartbeat so a healthy leader isn't spuriously displaced.
        RaftConfig {
            heartbeat_ticks: 3,
            election_min_ticks: 10,
            election_max_ticks: 18,
        }
    }
}
