name: Formal methods procedure

on:
  pull_request:
    paths:
      - 'formal/**'
      - 'src/membership.rs'
      - 'src/scheduler.rs'
      - 'src/placement.rs'
      - '.github/workflows/formal-methods-procedure.yml'
  push:
    branches: [main]
    paths:
      - 'formal/**'
      - 'src/membership.rs'
      - 'src/scheduler.rs'
      - 'src/placement.rs'
      - '.github/workflows/formal-methods-procedure.yml'
  schedule:
    - cron: '7 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-procedure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate procedure and machine inventory
        env:
          EXPECTED_REPOSITORY: fiducia-cloud/fiducia-brain.rs
        run: |
          python3 - <<'PY'
          import os
          import sys
          import tomllib
          from pathlib import Path

          errors = []
          manifest_path = Path('formal/procedure.toml')
          doc_path = Path('formal/PROCEDURE.md')

          try:
              data = tomllib.loads(manifest_path.read_text(encoding='utf-8'))
          except Exception as exc:
              print(f'could not parse {manifest_path}: {exc}', file=sys.stderr)
              raise SystemExit(1)

          for key, expected in (
              ('schema_version', 1),
              ('procedure_version', 1),
              ('repository', os.environ['EXPECTED_REPOSITORY']),
          ):
              if data.get(key) != expected:
                  errors.append(f'{key} must equal {expected!r}')

          policy = data.get('policy')
          if not isinstance(policy, dict):
              errors.append('missing [policy] table')
          else:
              for key in ('claim_classes', 'required_evidence'):
                  value = policy.get(key)
                  if not isinstance(value, list) or not value or not all(isinstance(item, str) and item.strip() for item in value):
                      errors.append(f'policy.{key} must be a non-empty string list')
              for key in ('counterexample', 'change_trigger'):
                  value = policy.get(key)
                  if not isinstance(value, str) or not value.strip():
                      errors.append(f'policy.{key} must be a non-empty string')

          machines = data.get('machine')
          if not isinstance(machines, list) or not machines:
              errors.append('at least one [[machine]] entry is required')
              machines = []

          seen = set()
          allowed_risks = {'critical', 'high', 'medium', 'low'}
          allowed_statuses = {'planned', 'modeling', 'active', 'deferred'}
          for index, machine in enumerate(machines, start=1):
              prefix = f'machine[{index}]'
              machine_id = machine.get('id')
              if not isinstance(machine_id, str) or not machine_id.strip():
                  errors.append(f'{prefix}.id must be a non-empty string')
              elif machine_id in seen:
                  errors.append(f'duplicate machine id {machine_id!r}')
              else:
                  seen.add(machine_id)
              if machine.get('risk') not in allowed_risks:
                  errors.append(f'{prefix}.risk must be one of {sorted(allowed_risks)}')
              if machine.get('status') not in allowed_statuses:
                  errors.append(f'{prefix}.status must be one of {sorted(allowed_statuses)}')
              for key in ('backend', 'owner'):
                  value = machine.get(key)
                  if not isinstance(value, str) or not value.strip():
                      errors.append(f'{prefix}.{key} must be a non-empty string')
              for key in ('source_paths', 'safety', 'liveness', 'faults', 'bounds', 'review_triggers'):
                  value = machine.get(key)
                  if not isinstance(value, list) or not value or not all(isinstance(item, str) and item.strip() for item in value):
                      errors.append(f'{prefix}.{key} must be a non-empty string list')
              for source in machine.get('source_paths', []):
                  if isinstance(source, str) and not Path(source).exists():
                      errors.append(f'{prefix}.source_paths entry does not exist: {source}')
              if machine.get('status') in {'modeling', 'active'}:
                  model_paths = machine.get('model_paths')
                  if not isinstance(model_paths, list) or not model_paths:
                      errors.append(f'{prefix}.model_paths is required for modeling/active machines')
                  else:
                      for model_path in model_paths:
                          if not isinstance(model_path, str) or not Path(model_path).exists():
                              errors.append(f'{prefix}.model_paths entry does not exist: {model_path}')

          try:
              document = doc_path.read_text(encoding='utf-8')
          except OSError as exc:
              errors.append(f'could not read {doc_path}: {exc}')
              document = ''
          for heading in ('## Change procedure', '## Claim language', '## Counterexamples', '## Required review triggers'):
              if heading not in document:
                  errors.append(f'{doc_path} is missing heading {heading!r}')

          if errors:
              for error in errors:
                  print(f'error: {error}', file=sys.stderr)
              raise SystemExit(1)

          summary = f'Validated {len(machines)} formal-methods machine inventories for {data["repository"]}.'
          print(summary)
          step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if step_summary:
              with open(step_summary, 'a', encoding='utf-8') as handle:
                  handle.write(f'## Formal-methods procedure\n\n{summary}\n')
          PY
