name: temporary-rustfmt-formal-scheduler

on:
  push:
    branches:
      - agent/den-569-scheduler-refinement
    paths:
      - ".github/workflows/temporary-rustfmt-formal-scheduler.yml"
      - "formal/scheduler_replay_common.rs"
      - "src/bin/fiducia-brain-scheduler-replay.rs"
      - "tests/formal_scheduler_refinement.rs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-rustfmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-569-scheduler-refinement
          fetch-depth: 1
          persist-credentials: true

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet; then
            echo "rustfmt made no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add formal/scheduler_replay_common.rs \
            src/bin/fiducia-brain-scheduler-replay.rs \
            tests/formal_scheduler_refinement.rs
          git commit -m "format scheduler refinement sources"
          git push origin HEAD:agent/den-569-scheduler-refinement
