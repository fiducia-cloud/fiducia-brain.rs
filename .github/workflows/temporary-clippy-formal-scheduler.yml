name: temporary-clippy-formal-scheduler

on:
  push:
    branches:
      - agent/den-569-scheduler-refinement
    paths:
      - ".github/workflows/temporary-clippy-formal-scheduler.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-clippy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch and shared path dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-569-scheduler-refinement
          fetch-depth: 1
          persist-credentials: true
          path: repo

      - name: Checkout shared interfaces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: ee8fe09f846f5a776d156c0b0d0d15582c8bd539
          path: fiducia-interfaces

      - name: Checkout shared routing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-routing.rs
          ref: c694bc5c58587bec12989a347e926c0040aacada
          path: fiducia-routing.rs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.95.0'
          components: clippy, rustfmt

      - name: Apply narrow structured-counterexample lint exception
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("formal/scheduler_replay_common.rs")
          source = path.read_text(encoding="utf-8")
          needle = "fn replay_trace(path: &Path) -> Result<TraceSummary, ReplayMismatch> {"
          replacement = (
              "// A mismatch deliberately carries the full expected/actual JSON projection so "
              "counterexamples remain self-contained.\n"
              "#[allow(clippy::result_large_err)]\n"
              + needle
          )
          if needle not in source:
              raise SystemExit("replay_trace signature not found")
          if "#[allow(clippy::result_large_err)]\n" not in source:
              source = source.replace(needle, replacement, 1)
              path.write_text(source, encoding="utf-8")
          PY
          cargo fmt --all
          cargo clippy --locked --all-targets -- -D warnings

      - name: Commit fix
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "no Clippy fix was required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add formal/scheduler_replay_common.rs
          git commit -m "document rich scheduler replay counterexamples"
          git push origin HEAD:agent/den-569-scheduler-refinement
