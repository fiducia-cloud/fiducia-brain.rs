name: scheduler-data-plane-composition

on:
  pull_request:
    paths:
      - ".github/workflows/scheduler-data-plane-composition.yml"
      - "docs/scheduler-data-plane-composition.md"
      - "tools/scheduler-data-plane-composition/**"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'den-1516-scheduler-data-plane-composition'
    name: Format and validate the owned DEN-1516 branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout owned pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Apply rustfmt
        run: >-
          cargo fmt
          --manifest-path tools/scheduler-data-plane-composition/Cargo.toml
          --all

      - name: Lint with warnings denied
        run: >-
          cargo clippy
          --manifest-path tools/scheduler-data-plane-composition/Cargo.toml
          --all-targets
          --locked
          --
          -D warnings

      - name: Run deterministic composition tests
        run: >-
          cargo test
          --manifest-path tools/scheduler-data-plane-composition/Cargo.toml
          --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: >-
          cargo doc
          --manifest-path tools/scheduler-data-plane-composition/Cargo.toml
          --locked
          --no-deps

      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          git add tools/scheduler-data-plane-composition
          if git diff --cached --quiet; then
            echo "rustfmt produced no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(DEN-1516): apply rustfmt"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
