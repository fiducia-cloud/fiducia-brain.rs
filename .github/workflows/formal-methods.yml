name: formal-methods

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  membership:
    name: Quint hybrid membership model
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: repo
    env:
      QUINT_PACKAGE: '@informalsystems/quint@0.32.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: repo

      - name: Checkout shared interfaces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: ee8fe09f846f5a776d156c0b0d0d15582c8bd539
          path: fiducia-interfaces

      - name: Checkout shared routing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-routing.rs
          ref: c694bc5c58587bec12989a347e926c0040aacada
          path: fiducia-routing.rs

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install Java for TLC
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.95.0'

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: repo

      - name: Typecheck membership model
        shell: bash
        run: |
          mkdir -p .formal-artifacts/membership
          set +e
          npx --yes --package="$QUINT_PACKAGE" quint typecheck \
            formal/brain_membership.qnt 2>&1 \
            | tee .formal-artifacts/membership/typecheck.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Simulate invariant and recovery witnesses
        shell: bash
        run: |
          set +e
          npx --yes --package="$QUINT_PACKAGE" quint run \
            formal/brain_membership.qnt \
            --max-samples=10000 \
            --max-steps=35 \
            --invariant=membership_safety \
            --witnesses \
              stale_delivery_reached \
              running_oracle_hold_reached \
              gone_oracle_dead_reached \
              timeout_dead_reached \
              draining_heartbeat_reached \
              resurrection_reached 2>&1 \
            | tee .formal-artifacts/membership/simulation.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Exhaustively check membership state space
        shell: bash
        run: |
          set +e
          npx --yes --package="$QUINT_PACKAGE" quint verify \
            formal/brain_membership.qnt \
            --backend=tlc \
            --invariant=membership_safety 2>&1 \
            | tee .formal-artifacts/membership/tlc.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Generate membership model-based traces
        shell: bash
        run: |
          set +e
          npx --yes --package="$QUINT_PACKAGE" quint run \
            formal/brain_membership.qnt \
            --max-samples=500 \
            --max-steps=30 \
            --n-traces=6 \
            --mbt \
            --out-itf='.formal-artifacts/membership/trace-{seq}.itf.json' 2>&1 \
            | tee .formal-artifacts/membership/trace-generation.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Replay generated membership traces against production Rust
        env:
          FIDUCIA_MEMBERSHIP_ITF_TRACE_DIR: .formal-artifacts
          FIDUCIA_REQUIRE_MEMBERSHIP_ITF_REPLAY: '1'
        run: >-
          cargo test --locked --test formal_membership_refinement
          generated_itf_traces_replay_against_membership -- --nocapture

      - name: Upload membership diagnostics and traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fiducia-brain-membership-formal
          path: repo/.formal-artifacts/membership/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  reconfiguration:
    name: Quint shard reconfiguration model
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QUINT_PACKAGE: '@informalsystems/quint@0.32.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install Java for TLC
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Typecheck reconfiguration model
        shell: bash
        run: |
          mkdir -p .formal-artifacts/reconfiguration
          set +e
          npx --yes --package="$QUINT_PACKAGE" quint typecheck \
            formal/brain_reconfiguration.qnt 2>&1 \
            | tee .formal-artifacts/reconfiguration/typecheck.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Simulate invariant and staged-move witnesses
        shell: bash
        run: |
          set +e
          npx --yes --package="$QUINT_PACKAGE" quint run \
            formal/brain_reconfiguration.qnt \
            --max-samples=20000 \
            --max-steps=55 \
            --invariant=reconfiguration_safety \
            --witnesses \
              incomplete_membership_hold_reached \
              degraded_membership_hold_reached \
              completed_move_reached \
              rollback_reached \
              leader_transfer_reached 2>&1 \
            | tee .formal-artifacts/reconfiguration/simulation.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Capture verifier command surface
        shell: bash
        run: |
          npx --yes --package="$QUINT_PACKAGE" quint verify --help 2>&1 \
            | tee .formal-artifacts/reconfiguration/verify-help.log

      - name: Exhaustively check reconfiguration state space
        shell: bash
        env:
          NODE_OPTIONS: '--trace-uncaught'
          RUST_BACKTRACE: full
        run: |
          mkdir -p .formal-artifacts/reconfiguration/tmp
          export TMPDIR="$PWD/.formal-artifacts/reconfiguration/tmp"

          set +e
          npx --yes --package="$QUINT_PACKAGE" quint verify \
            formal/brain_reconfiguration.qnt \
            --backend=tlc \
            --invariant=reconfiguration_safety \
            --verbosity=3 2>&1 \
            | tee .formal-artifacts/reconfiguration/tlc.log
          status=${PIPESTATUS[0]}

          # Quint/Apalache may place generated TLA, CFG, JSON, or log files outside
          # TMPDIR. Retain only small textual diagnostics rather than verifier jars.
          mkdir -p .formal-artifacts/reconfiguration/quint-diagnostics
          if [[ -d "$HOME/.quint" ]]; then
            while IFS= read -r -d '' diagnostic; do
              relative=${diagnostic#"$HOME/.quint/"}
              destination=".formal-artifacts/reconfiguration/quint-diagnostics/$relative"
              mkdir -p "$(dirname "$destination")"
              cp "$diagnostic" "$destination"
            done < <(
              find "$HOME/.quint" -type f \
                \( -name '*.log' -o -name '*.tla' -o -name '*.cfg' -o -name '*.json' -o -name '*.txt' \) \
                -size -8M -print0
            )
          fi

          find .formal-artifacts/reconfiguration/tmp -maxdepth 6 -type f -print \
            > .formal-artifacts/reconfiguration/tmp-files.txt || true
          set -e
          exit "$status"

      - name: Generate reconfiguration model-based traces
        shell: bash
        run: |
          set +e
          npx --yes --package="$QUINT_PACKAGE" quint run \
            formal/brain_reconfiguration.qnt \
            --max-samples=750 \
            --max-steps=45 \
            --n-traces=6 \
            --mbt \
            --out-itf='.formal-artifacts/reconfiguration/trace-{seq}.itf.json' 2>&1 \
            | tee .formal-artifacts/reconfiguration/trace-generation.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload reconfiguration diagnostics and traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fiducia-brain-reconfiguration-formal
          path: .formal-artifacts/reconfiguration/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  composition:
    name: Quint scheduler/data-plane composition model
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QUINT_PACKAGE: '@informalsystems/quint@0.32.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install Java for TLC
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Typecheck scheduler/data-plane composition model
        shell: bash
        run: |
          mkdir -p .formal-artifacts/composition
          set +e
          npx --yes --package="$QUINT_PACKAGE" quint typecheck \
            formal/brain_composition.qnt 2>&1 \
            | tee .formal-artifacts/composition/typecheck.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Simulate safety and bounded progress witnesses
        shell: bash
        run: |
          set +e
          npx --yes --package="$QUINT_PACKAGE" quint run \
            formal/brain_composition.qnt \
            --max-samples=20000 \
            --max-steps=30 \
            --invariant=composition_safety \
            --witnesses \
              move_started_reached \
              active_reconcile_hold_reached \
              pre_promotion_rollback_reached \
              post_promotion_rollback_reached \
              retry_reached \
              promotion_reached \
              leader_transfer_reached \
              convergence_reached \
              idempotent_stable_replay_reached 2>&1 \
            | tee .formal-artifacts/composition/simulation.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Exhaustively check finite composition state graph
        shell: bash
        run: |
          set +e
          npx --yes --package="$QUINT_PACKAGE" quint verify \
            formal/brain_composition.qnt \
            --backend=tlc \
            --invariant=composition_safety 2>&1 \
            | tee .formal-artifacts/composition/tlc.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Generate composition model-based traces
        shell: bash
        run: |
          set +e
          npx --yes --package="$QUINT_PACKAGE" quint run \
            formal/brain_composition.qnt \
            --max-samples=10000 \
            --max-steps=24 \
            --n-traces=8 \
            --mbt \
            --out-itf='.formal-artifacts/composition/trace-{seq}.itf.json' 2>&1 \
            | tee .formal-artifacts/composition/trace-generation.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload composition diagnostics and traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fiducia-brain-composition-formal
          path: .formal-artifacts/composition/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
