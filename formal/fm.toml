# Schema-v1 manifest consumed by the incubating fmctl runner.
schema_version = 1
project = "fiducia-brain.rs"
model = "brain-membership"
language = "quint"
spec = "formal/brain_membership.qnt"
main = "brain_membership"
init = "init"
step = "step"
invariants = ["membership_safety"]
witnesses = [
  "stale_delivery_reached",
  "running_oracle_hold_reached",
  "gone_oracle_dead_reached",
  "timeout_dead_reached",
  "draining_heartbeat_reached",
  "resurrection_reached",
]

[toolchain]
quint = "0.32.0"
node = "22"
java = "21"
rust = "1.95.0"
npx = "npx"

[execution]
timeout_seconds = 1200
max_output_bytes = 8388608
artifacts_dir = ".formal-artifacts"

[simulation]
backend = "typescript"
max_samples = 10000
max_steps = 35

[verification]
backend = "tlc"
exhaustive_finite_model = true

[traces]
format = "itf"
model_based_testing_metadata = true
backend = "typescript"
count = 6
max_steps = 30
max_samples = 10000

[adapters.rust]
strategy = "itf-replay-and-bounded-independent-reference"
target = "tests/formal_membership_refinement.rs"
status = "active"
issue = "DEN-569"
