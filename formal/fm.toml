# Schema-v1 manifest for fmctl-compatible model discovery and execution.
schema_version = 1
project = "fiducia-brain.rs"

[toolchain]
quint = "0.32.0"
node = "22"
java = "21"
rust = "1.95.0"

[[models]]
name = "brain-membership"
language = "quint"
spec = "formal/brain_membership.qnt"
main = "brain_membership"
init = "init"
step = "step"
invariants = ["membership_safety"]
witnesses = [
  "stale_delivery_reached",
  "running_oracle_hold_reached",
  "gone_oracle_dead_reached",
  "timeout_dead_reached",
  "draining_heartbeat_reached",
  "resurrection_reached",
]

[models.bounds]
nodes = 1
health_states = 4
oracle_verdicts = 3
heartbeat_sequences = 4
report_variants = 3
rust_max_depth = 6
rust_max_states = 10000
rust_max_transitions = 200000

[models.simulation]
backend = "typescript"
max_samples = 10000
max_steps = 35

[models.verification]
backend = "tlc"
exhaustive_finite_model = true

[models.traces]
format = "itf"
model_based_testing_metadata = true
count = 6
max_steps = 30

[models.adapters.rust]
strategy = "bounded-independent-reference"
target = "tests/formal_membership_refinement.rs"
status = "implemented"
max_depth = 6
max_states = 10000
max_transitions = 200000

[[models]]
name = "brain-reconfiguration"
language = "quint"
spec = "formal/brain_reconfiguration.qnt"
main = "brain_reconfiguration"
init = "init"
step = "step"
invariants = ["reconfiguration_safety"]
witnesses = [
  "incomplete_membership_hold_reached",
  "degraded_membership_hold_reached",
  "completed_move_reached",
  "rollback_reached",
  "leader_transfer_reached",
]

[models.bounds]
candidate_nodes = 4
replication_factor = 3
shards = 1
active_replacements = 1

[models.simulation]
backend = "typescript"
max_samples = 20000
max_steps = 55

[models.verification]
backend = "tlc"
exhaustive_finite_model = true

[models.traces]
format = "itf"
model_based_testing_metadata = true
count = 6
max_steps = 45

[models.adapters.rust]
strategy = "itf-replay-and-scheduler-refinement"
status = "planned"

[outputs]
formats = ["human", "json", "junit", "sarif", "itf"]
artifact_directory = ".formal-artifacts"
