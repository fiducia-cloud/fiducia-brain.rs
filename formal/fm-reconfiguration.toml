# Secondary schema-v1 manifest for explicit fmctl --manifest execution.
schema_version = 1
project = "fiducia-brain.rs"
model = "brain-reconfiguration"
language = "quint"
spec = "formal/brain_reconfiguration.qnt"
main = "brain_reconfiguration"
init = "init"
step = "step"
invariants = ["reconfiguration_safety"]
witnesses = [
  "incomplete_membership_hold_reached",
  "degraded_membership_hold_reached",
  "completed_move_reached",
  "rollback_reached",
  "leader_transfer_reached",
]

[toolchain]
quint = "0.32.0"
node = "22"
java = "21"
rust = "1.95.0"
npx = "npx"

[execution]
timeout_seconds = 1200
max_output_bytes = 8388608
artifacts_dir = ".formal-artifacts"

[simulation]
backend = "typescript"
max_samples = 20000
max_steps = 55

[verification]
backend = "tlc"
exhaustive_finite_model = true

[traces]
format = "itf"
model_based_testing_metadata = true
backend = "typescript"
count = 6
max_steps = 45
max_samples = 20000

[adapters.rust]
strategy = "itf-replay-and-scheduler-refinement"
status = "planned"
issue = "DEN-569"
