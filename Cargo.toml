# Crate manifest: package metadata and dependencies for the fiducia-brain service.
[package]
name = "fiducia-brain"
version = "0.1.0"
edition = "2021"
description = "Control plane for fiducia.cloud — shard placement, scaling, and node-failure handling (the 'brain' cluster)."

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower-http = { version = "0.5", features = ["trace", "timeout", "limit", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
subtle = "2"

fiducia-telemetry = { git = "https://github.com/fiducia-cloud/fiducia-telemetry.rs", tag = "v0.2.1" }
fiducia-interfaces = { path = "../fiducia-interfaces/generated/rust" }
fiducia-routing = { path = "../fiducia-routing.rs" }

# External orchestration is deliberately outside the brain's own Raft quorum.
# This exact fiducia-lib-core revision owns lock identities backed by
# ores-locks-and-leases without enabling its Fiducia client adapter, allowing
# Cloudflare Durable Objects to fence placement application/migrations while a
# Fiducia control plane itself is recovering.
fiducia-lib-core = { git = "https://github.com/fiducia-cloud/fiducia-lib-core.git", rev = "47d637ba92db3fc35b04bafe9bf66ff5b0223216", default-features = false }
